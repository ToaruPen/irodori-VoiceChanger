name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install developer tools
        run: brew install just swiftlint
      - name: Install JavaScript tooling
        run: npm ci
      - name: Run repository gate
        run: just check
